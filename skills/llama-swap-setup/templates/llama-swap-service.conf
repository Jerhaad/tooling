[Unit]
Description=LLAMA-Swap: Model Serving on GPU
After=network.target
Wants=network-online.target

[Service]
Type=simple
User=hermes
Group=hermes
WorkingDirectory=/opt/llama.cpp
Restart=always
RestartSec=15
ExecStartPre=/opt/llama.cpp/build/bin/llama-server --version
ExecStart=/opt/llama.cpp/build/bin/llama-server \
    --model /opt/models/{MODEL_PATH} \
    --host 0.0.0.0 --port {PORT} \
    --tensor-split {TENSOR_SPLIT} \
    --ngl 999 \
    --ctx-size {CTX_SIZE} \
    --threads {THREADS} \
    --jinja \
    --log-disable
ExecStop=/bin/kill -TERM $MAINPID
Environment="HF_HOME=/opt/huggingface-cache"

# Multi-GPU tensor-split examples:
# 2x RTX 3090: --tensor-split 1,1,0
# Only 5060 Ti: --tensor-split 0,0,1
# Single GPU: --tensor-split 1,0,0

# MTP model flags (add if using MTP GGUF):
# --spec-type draft-mtp --spec-draft-n-max 2

[Install]
WantedBy=multi-user.target