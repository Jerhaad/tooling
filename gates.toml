# gates.toml for the agent-tools checkout itself.
#
# A tool and the test that pins it share a `when`, so editing either runs the
# test. tests/test_gate_coverage.py fails when one does not.

[[gates]]
name = "task-mirror-check tests"
when = '^(bin/task-mirror-check|lib/workflow_steps\.py|tests/test_task_mirror_check\.py|lib/manifest\.py)$'
run = "python3 tests/test_task_mirror_check.py"

# A gate that always runs when the manifest reader or any bin/ tool moves.
# The reader is the foundation every other tool builds on; a change to a
# bin/ script can regress the way its output reaches bash, even when the
# script itself never touched the reader. We pin the refusal contract
# (missing field -> named error that survives `set -e`) rather than parsing
# the manifest's shape -- a parse is green against a manifest the reader
# would still reject.
[[gates]]
name = "manifest reader contract"
when = '^(lib/manifest\.py|tests/test_manifest\.py|bin/)'
run = "python3 tests/test_manifest.py"

[[gates]]
name = "gate-verify tests"
when = '^(bin/gate-verify|tests/test_gate_verify\.py)$'
run = "python3 tests/test_gate_verify.py"

[[gates]]
name = "pr-ready tests"
when = '^(bin/pr-ready|tests/test_pr_ready\.py|tests/fixtures/gh_.*\.json)$'
run = "python3 tests/test_pr_ready.py"

[[gates]]
name = "gates workflow"
when = '^(\.github/workflows/gates\.yaml|lib/workflow_steps\.py|tests/test_gates_workflow\.py)$'
run = "python3 tests/test_gates_workflow.py"

[[gates]]
name = "lane-settled tests"
when = '^(bin/lane-settled|bin/hermes-implement|bin/gate-verify|tests/test_lane_settled\.py)$'
run = "python3 tests/test_lane_settled.py"

[[gates]]
name = "lane-watch tests"
when = '^(bin/lane-watch|tests/test_lane_watch\.py)$'
run = "python3 tests/test_lane_watch.py"

[[gates]]
name = "hermes-implement tmux tests"
when = '^(bin/hermes-implement|tests/test_hermes_implement_tmux\.py)$'
run = "python3 tests/test_hermes_implement_tmux.py"

[[gates]]
name = "tools-live-run tests"
when = '^(bin/tools-live-run|tests/test_tools_live_run\.py)$'
run = "python3 tests/test_tools_live_run.py"

[[gates]]
name = "remote-task drift tests"
when = '^(bin/remote-task|lib/migrator\.py|bin/task-mirror-check|lib/workflow_steps\.py|tests/test_remote_task_drift\.py)$'
run = "python3 tests/test_remote_task_drift.py"

[[gates]]
name = "remote path tests"
when = '^(bin/remote-task|bin/remote-run|lib/common\.sh|tests/test_remote_path\.py)$'
run = "python3 tests/test_remote_path.py"

[[gates]]
name = "remote lane tests"
when = '^(bin/remote-task|lib/common\.sh|hosts\.env\.example|tests/test_remote_lane\.py)$'
run = "python3 tests/test_remote_lane.py"

[[gates]]
name = "remote-prune tests"
when = '^(bin/remote-prune|tests/test_remote_prune\.py)$'
run = "python3 tests/test_remote_prune.py"

[[gates]]
name = "gate-prove tests"
when = '^(bin/gate-prove|tests/test_gate_prove\.py)$'
run = "python3 tests/test_gate_prove.py"

# install/ and pipeline/ ship shell with no suite. `bash -n` parses; it does not
# run, so a host that refuses to clone is unseen. `xargs -n1` is not incidental:
# test_gate_coverage.py rejects the forms that check one file or none.
[[gates]]
name = "install syntax"
when = '^install/.*\.sh$'
run = "find install -name '*.sh' -print0 | xargs -0 -n1 bash -n"

[[gates]]
name = "pipeline syntax"
when = '^pipeline/.*\.sh$'
run = "find pipeline -name '*.sh' -print0 | xargs -0 -n1 bash -n"

[[gates]]
name = "pick_lane tests"
when = '^(pipeline/pick_lane\.py|tests/test_pick_lane\.py)$'
run = "python3 tests/test_pick_lane.py"

# The manifest and its checker, run on any diff that adds a tool or a suite.
# That makes this `when` a catch-all over bin/ and tests/, which the PHONY
# probe correctly declines to count as coverage for any one of them.
[[gates]]
name = "gate coverage"
when = '^(gates\.toml|tests/test_gate_coverage\.py|bin/|tests/test_[^/]*\.py)'
run = "python3 tests/test_gate_coverage.py"

[[gates]]
name = "triage-on-merge tests"
when = '^(pipeline/triage-on-merge\.sh|bin/hermes-triage|tests/test_triage_on_merge\.py)$'
run = "python3 tests/test_triage_on_merge.py"

# Syntax floor for the eight bin/ tools that have no suite. Each gate names
# exactly the one file it parses: `bash -n a.sh b.sh` parses only the first
# and treats the rest as positional args, and `find -exec` does not propagate
# the exit status of what it runs, so the run has to be the per-file form.
# This establishes the file parses and nothing more -- real coverage would
# pin a behaviour, not a parse, and writing eight suites is a separate task.
[[gates]]
name = "findings-ledger tests"
when = '^(bin/findings-ledger|tests/test_findings_ledger\.py)$'
run = "python3 tests/test_findings_ledger.py"

[[gates]]
name = "gate-untested syntax"
when = '^(bin/gate-untested)$'
run = "bash -n bin/gate-untested"

[[gates]]
name = "hermes-doctor syntax"
when = '^(bin/hermes-doctor)$'
run = "python3 -m py_compile bin/hermes-doctor"

[[gates]]
name = "hermes-skills-sync syntax"
when = '^(bin/hermes-skills-sync)$'
run = "bash -n bin/hermes-skills-sync"

[[gates]]
name = "hermes-triage syntax"
when = '^(bin/hermes-triage)$'
run = "bash -n bin/hermes-triage"

[[gates]]
name = "issue-grade syntax"
when = '^(bin/issue-grade)$'
run = "python3 -m py_compile bin/issue-grade"

[[gates]]
name = "pg-explain syntax"
when = '^(bin/pg-explain)$'
run = "bash -n bin/pg-explain"

[[gates]]
name = "redaction-check syntax"
when = '^(bin/redaction-check)$'
run = "bash -n bin/redaction-check"

[[gates]]
name = "repo-branch-sweep syntax"
when = '^(bin/repo-branch-sweep)$'
run = "bash -n bin/repo-branch-sweep"

[[gates]]
name = "hermes review tests"
when = '^(skills/hermes-review/scripts/hermes-scrutinize\.sh|tests/test_hermes_scrutinize\.py)$'
run = "python3 tests/test_hermes_scrutinize.py"

# Syntax floor for the two review drivers; their shared logic is in
# lib/common.sh and the review script, which the suite above pins.
[[gates]]
name = "hermes-review-pr syntax"
when = '^(bin/hermes-review-pr)$'
run = "bash -n bin/hermes-review-pr"

[[gates]]
name = "hermes-review-sweep syntax"
when = '^(bin/hermes-review-sweep)$'
run = "bash -n bin/hermes-review-sweep"

# The squash tool and its test. The test exercises the bug from
# issue #68 directly: a base ref that has moved between fork and squash
# must leave the branch's tree unchanged. `bash -n` parses; the suite
# proves behaviour.
[[gates]]
name = "squash tests"
when = '^(bin/squash|tests/test_squash\.py)$'
run = "python3 tests/test_squash.py"

[[gates]]
name = "find_prose tests"
when = '^(skills/condense-prose/find_prose\.py|tests/test_find_prose\.py)$'
run = "python3 tests/test_find_prose.py"

[[gates]]
name = "finding-check tests"
when = '^(bin/finding-check|tests/test_finding_check\.py)$'
run = "python3 tests/test_finding_check.py"

[[gates]]
name = "push-guard tests"
when = '^(bin/push-guard|hooks/pre-push|tests/test_push_guard\.py)$'
run = "python3 tests/test_push_guard.py"
